<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2F+A2E 动画独立测试预览器</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
        #container { width: 100vw; height: 100vh; }
        #ui { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: rgba(20, 20, 20, 0.9); padding: 20px 30px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(20px); display: flex; align-items: center; gap: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); z-index: 100; }
        button { background: #2563eb; color: white; border: none; padding: 12px 28px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; font-size: 16px; }
        button:hover { background: #3b82f6; transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { background: #3f3f46; cursor: not-allowed; transform: none; }
        #info { display: flex; flex-direction: column; min-width: 120px; border-left: 1px solid rgba(255,255,255,0.1); padding-left: 20px; }
        .label { font-size: 10px; color: #71717a; text-transform: uppercase; font-weight: 800; letter-spacing: 0.05em; }
        .value { font-family: monospace; font-size: 14px; color: #3b82f6; }
        #loading { position: absolute; inset: 0; background: #09090b; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }
        .spinner { width: 40px; height: 40px; border: 4px solid #1e1e2e; border-top-color: #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div id="loading-text">正在初始化 3D 数字人引擎...</div>
    </div>

    <div id="container"></div>

    <div id="ui">
        <button id="play-btn" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            预览动画
        </button>
        <div id="info">
            <span class="label">数据状态</span>
            <span id="frame-count" class="value">等待加载...</span>
        </div>
    </div>

    <audio id="test-audio" src="frontend/public/test_audio.wav"></audio>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const ARKIT_BS = [
            'eyeBlinkLeft', 'eyeLookDownLeft', 'eyeLookInLeft', 'eyeLookOutLeft', 'eyeLookUpLeft',
            'eyeSquintLeft', 'eyeWideLeft', 'eyeBlinkRight', 'eyeLookDownRight', 'eyeLookInRight',
            'eyeLookOutRight', 'eyeLookUpRight', 'eyeSquintRight', 'eyeWideRight', 'jawForward',
            'jawLeft', 'jawRight', 'jawOpen', 'mouthClose', 'mouthFunnel', 'mouthPucker',
            'mouthLeft', 'mouthRight', 'mouthSmileLeft', 'mouthSmileRight', 'mouthFrownLeft',
            'mouthFrownRight', 'mouthDimpleLeft', 'mouthDimpleRight', 'mouthStretchLeft',
            'mouthStretchRight', 'mouthRollLower', 'mouthRollUpper', 'mouthShrugLower',
            'mouthShrugUpper', 'mouthPressLeft', 'mouthPressRight', 'mouthLowerDownLeft',
            'mouthLowerDownRight', 'mouthUpperUpLeft', 'mouthUpperUpRight', 'browDownLeft',
            'browDownRight', 'browInnerUp', 'browOuterUpLeft', 'browOuterUpRight', 'cheekPuff',
            'cheekSquintLeft', 'cheekSquintRight', 'noseSneerLeft', 'noseSneerRight', 'tongueOut'
        ];

        let scene, camera, renderer, controls, mesh, morphMap = new Map();
        let animationData = [], isPlaying = false;

        const container = document.getElementById('container');
        const playBtn = document.getElementById('play-btn');
        const audio = document.getElementById('test-audio');
        const frameCountEl = document.getElementById('frame-count');
        const loadingScreen = document.getElementById('loading');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 0.6);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 0, 0);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(1, 2, 3);
            scene.add(dirLight);

            // 加载模型
            const loader = new GLTFLoader();
            loader.load('frontend/public/models/avatar.glb', (gltf) => {
                gltf.scene.traverse(child => {
                    if (child.isMesh && child.morphTargetDictionary) {
                        mesh = child;
                        ARKIT_BS.forEach(name => {
                            const idx = child.morphTargetDictionary[name] || child.morphTargetDictionary[name.toLowerCase()];
                            if (idx !== undefined) morphMap.set(name, idx);
                        });
                    }
                });

                const box = new THREE.Box3().setFromObject(gltf.scene);
                const center = box.getCenter(new THREE.Vector3());
                gltf.scene.position.sub(center);
                scene.add(gltf.scene);
                
                checkReady();
            }, undefined, (e) => {
                console.error("模型加载失败:", e);
                document.getElementById('loading-text').innerText = "错误: 找不到模型文件 (public/models/avatar.glb)";
            });

            // 加载动画数据
            fetch('frontend/public/mouth_animation.json')
                .then(r => r.json())
                .then(data => {
                    animationData = data;
                    frameCountEl.innerText = `${data.length} 帧就绪`;
                    checkReady();
                })
                .catch(e => {
                    console.error("数据加载失败:", e);
                    frameCountEl.innerText = "数据加载失败";
                });

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function checkReady() {
            if (mesh && animationData.length > 0) {
                loadingScreen.style.display = 'none';
                playBtn.disabled = false;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        playBtn.onclick = () => {
            if (isPlaying || !animationData.length) return;
            
            isPlaying = true;
            playBtn.disabled = true;
            audio.currentTime = 0;
            audio.play();

            const startTime = performance.now();
            const FPS = 60;

            function updateLoop() {
                if (!isPlaying) return;
                const elapsed = (performance.now() - startTime) / 1000;
                const frameIdx = Math.floor(elapsed * FPS);

                if (frameIdx < animationData.length) {
                    const frame = animationData[frameIdx];
                    ARKIT_BS.forEach((name, i) => {
                        const mIdx = morphMap.get(name);
                        if (mIdx !== undefined) {
                            mesh.morphTargetInfluences[mIdx] = frame[i];
                        }
                    });
                    requestAnimationFrame(updateLoop);
                } else {
                    isPlaying = false;
                    playBtn.disabled = false;
                }
            }
            updateLoop();
        };

        init();
    </script>
</body>
</html>
