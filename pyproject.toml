[project]
name = "emotional-companion"
version = "0.1.0"
description = "AI Emotional Companionship Agent System with Perception-Cognition-Intervention Loop"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "litellm>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.22",
    "fer>=25.10.3",
    "opencv-python-headless>=4.13.0.92",
    "numpy>=2.2.6",
    "edge-tts>=7.2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emotional_companion"]
