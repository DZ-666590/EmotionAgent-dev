<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>A2F Mouth Animation Player</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; overflow: hidden; }
        #info { position: absolute; top: 10px; left: 10px; z-index: 100; pointer-events: none; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #444; color: white; border: 1px solid #666; border-radius: 4px; }
        button:hover { background: #666; }
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="info">
        <h3>Audio2Face 离线播放测试</h3>
        <p>音频: test_audio.wav</p>
        <p>数据: mouth_animation.json</p>
        <div id="status">准备就绪</div>
    </div>
    <div id="controls">
        <button id="playBtn">播放并观察口型</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        let scene, camera, renderer, model, headMesh;
        let animationData = null;
        let audio = new Audio('test_audio.wav');
        let isPlaying = false;
        let startTime = 0;

        const ARKIT_NAMES = [
            "browDownLeft", "browDownRight", "browInnerUp", "browOuterUpLeft", "browOuterUpRight",
            "cheekPuff", "cheekSquintLeft", "cheekSquintRight", "eyeBlinkLeft", "eyeBlinkRight",
            "eyeLookDownLeft", "eyeLookDownRight", "eyeLookInLeft", "eyeLookInRight", "eyeLookOutLeft",
            "eyeLookOutRight", "eyeLookUpLeft", "eyeLookUpRight", "eyeSquintLeft", "eyeSquintRight",
            "eyeWideLeft", "eyeWideRight", "jawForward", "jawLeft", "jawOpen",
            "jawRight", "mouthClose", "mouthDimpleLeft", "mouthDimpleRight", "mouthFrownLeft",
            "mouthFrownRight", "mouthFunnel", "mouthLeft", "mouthLowerDownLeft", "mouthLowerDownRight",
            "mouthPressLeft", "mouthPressRight", "mouthPucker", "mouthRight", "mouthRollLower",
            "mouthRollUpper", "mouthShrugLower", "mouthShrugUpper", "mouthSmileLeft", "mouthSmileRight",
            "mouthStretchLeft", "mouthStretchRight", "mouthUpperUpLeft", "mouthUpperUpRight", "noseSneerLeft",
            "noseSneerRight", "tongueOut"
        ];

        init();

        async function init() {
            // 1. Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0.5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(1, 1, 2);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));

            // 2. Load Model
            const loader = new GLTFLoader();
            document.getElementById('status').innerText = "正在加载模型...";
            
            // 修正路径为 models/avatar.glb
            loader.load('/models/avatar.glb', (gltf) => {
                model = gltf.scene;
                scene.add(model);
                
                // 查找带有 morphTargets 的网格 (通常是头或脸)
                model.traverse(child => {
                    if (child.isMesh && child.morphTargetInfluences) {
                        headMesh = child;
                        console.log("找到面部网格:", child.name);
                    }
                });

                if (!headMesh) {
                    document.getElementById('status').innerText = "错误: 未在模型中找到 morphTargets";
                } else {
                    document.getElementById('status').innerText = "模型加载完成，正在加载动画数据...";
                    loadAnimation();
                }
            });

            window.addEventListener('resize', onWindowResize);
        }

        async function loadAnimation() {
            try {
                const response = await fetch('mouth_animation.json');
                animationData = await response.json();
                document.getElementById('status').innerText = "准备就绪！点击播放。";
            } catch (e) {
                document.getElementById('status').innerText = "错误: 无法加载 mouth_animation.json";
            }
        }

        document.getElementById('playBtn').onclick = () => {
            if (!animationData || !headMesh) return;
            
            audio.currentTime = 0;
            audio.play();
            isPlaying = true;
            startTime = performance.now();
            document.getElementById('status').innerText = "正在播放...";
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying && animationData) {
                const elapsedSeconds = (performance.now() - startTime) / 1000;
                
                // A2F 通常是 30fps 或 60fps。我们的 frame_index 是帧序号。
                // 寻找最接近当前时间的帧
                const frameRate = 30; // 假设 30fps
                const targetFrameIndex = Math.floor(elapsedSeconds * frameRate);
                
                const frameData = animationData.find(f => f.frame === targetFrameIndex);
                
                if (frameData) {
                    applyWeights(frameData.weights);
                }

                if (elapsedSeconds > audio.duration + 1) {
                    isPlaying = false;
                    document.getElementById('status').innerText = "播放完毕";
                }
            }

            renderer.render(scene, camera);
        }

        function applyWeights(weights) {
            if (!headMesh || !headMesh.morphTargetDictionary) return;

            const dict = headMesh.morphTargetDictionary;
            const influences = headMesh.morphTargetInfluences;

            // 定义增益系数，让动作更夸张一些
            const GAIN = 1.8; 

            ARKIT_NAMES.forEach((name, index) => {
                if (dict[name] !== undefined) {
                    let value = weights[index];
                    
                    // 对口部关键动作进行额外增强
                    if (name.startsWith('mouth') || name.startsWith('jaw')) {
                        value *= GAIN;
                    }
                    
                    // 确保不超过 1.0
                    influences[dict[name]] = Math.min(1.0, value);
                }
            });
        }

        animate();
    </script>
</body>
</html>
